<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ARC INNOVATE — Lead CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2B6CB0; --blue-d:#1F5490; --green:#3A8A4A;
    --ink:#1a2332; --mid:#5b6b7f; --line:#dfe5ec;
    --bg:#f4f6f9; --card:#fff; --warn:#c2410c; --lost:#8a94a3;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Nunito,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
  header .sp{flex:1}
  button{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;transition:.15s}
  .btn-w{background:rgba(255,255,255,.16);color:#fff}
  .btn-w:hover{background:rgba(255,255,255,.28)}
  .btn-p{background:var(--blue);color:#fff}
  .btn-p:hover{background:var(--blue-d)}
  .btn-g{background:var(--green);color:#fff}
  .btn-o{background:#fff;color:var(--mid);border:1px solid var(--line)}
  .btn-o:hover{border-color:var(--blue);color:var(--blue)}
  .wrap{max-width:1500px;margin:0 auto;padding:18px 20px 60px}

  /* funnel */
  .funnel{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px}
  .fstep{flex:1;min-width:112px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;cursor:pointer;position:relative}
  .fstep:hover{border-color:var(--blue)}
  .fstep.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(43,108,176,.16)}
  .fstep .n{font-size:26px;font-weight:800;line-height:1.05}
  .fstep .l{font-size:10.5px;font-weight:800;color:var(--mid);letter-spacing:.6px;margin-top:3px}
  .fstep .c{font-size:10.5px;color:var(--mid);margin-top:3px;height:14px}

  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0 14px}
  input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(43,108,176,.3);border-color:var(--blue)}
  #q{flex:1;min-width:190px}

  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(20,35,60,.07)}
  th{text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mid);padding:11px 10px;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
  th:hover{color:var(--blue)}
  td{padding:9px 10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  tbody tr:hover{background:#f8fafc}
  .nm{font-weight:700;cursor:pointer}
  .nm:hover{color:var(--blue);text-decoration:underline}
  .sub{font-size:11.5px;color:var(--mid)}
  select.st{font-size:11.5px;font-weight:800;padding:5px 7px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
  .stale{color:var(--warn);font-weight:700}
  .empty{padding:44px;text-align:center;color:var(--mid);background:var(--card);border-radius:var(--radius)}

  .ov{position:fixed;inset:0;background:rgba(16,26,42,.55);display:none;align-items:flex-start;justify-content:center;padding:22px;overflow-y:auto;z-index:50}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:22px}
  .modal h2{margin:0 0 16px;font-size:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:11.5px;font-weight:800;color:var(--mid);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%}
  .full{grid-column:1/-1}
  .acts{display:flex;gap:9px;margin-top:18px;align-items:center}
  .acts .sp{flex:1}
  .del{background:none;color:#b91c1c;border:1px solid #fecaca}
  .hint{font-size:11.5px;color:var(--mid);margin-top:5px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  #toast.on{opacity:1}
  .setup{background:#fff8e6;border:1px solid #f5d78e;border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .setup code{background:#fff;padding:2px 5px;border-radius:4px;font-size:12.5px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.hide-s{display:none}}
</style>
</head>
<body>

<header>
  <h1>ARC INNOVATE — Lead CRM</h1>
  <span class="sp"></span>
  <button class="btn-w" id="bNew">+ New lead</button>
  <button class="btn-w" id="bCsv">Export all CSV</button>
  <button class="btn-w" id="bMeta">Meta customer list</button>
  <button class="btn-w" id="bReload">Reload</button>
</header>

<div class="wrap">
  <div class="setup" id="setup" style="display:none">
    <strong>Not connected yet.</strong> Open this file and set <code>API_URL</code> and <code>TOKEN</code>
    at the top of the script block to your Apps Script web-app URL and token. Until then the CRM runs on
    local demo data and nothing is saved.
  </div>

  <div class="funnel" id="funnel"></div>

  <div class="bar">
    <input id="q" placeholder="Search name, school, phone, notes…">
    <select id="fSource"><option value="">All sources</option></select>
    <select id="fInterest"><option value="">All interests</option></select>
    <select id="fSchool"><option value="">All schools</option></select>
    <button class="btn-o" id="bClear">Clear filters</button>
    <span class="sub" id="count"></span>
  </div>

  <div id="tableHost"></div>
</div>

<div class="ov" id="ov">
  <div class="modal f">
    <h2 id="mTitle">New lead</h2>
    <div class="grid">
      <div><label>Parent name *</label><input id="i_name"></div>
      <div><label>Child age</label><input id="i_child_age" type="number" min="3" max="18"></div>
      <div><label>School</label><input id="i_school" list="dl_school"><datalist id="dl_school"></datalist></div>
      <div><label>Interest</label><input id="i_interest" list="dl_interest">
        <datalist id="dl_interest">
          <option value="Design"><option value="3D"><option value="Tech"><option value="Craft">
        </datalist></div>
      <div><label>Source</label><input id="i_source" list="dl_source">
        <datalist id="dl_source">
          <option value="Meta"><option value="Referral"><option value="School"><option value="Walk-in"><option value="Instagram">
        </datalist></div>
      <div><label>Campaign / ad set</label><input id="i_campaign" placeholder="e.g. BKK-Parents-Design-Sep"></div>
      <div><label>Status</label><select id="i_status"></select></div>
      <div><label>Value THB</label><input id="i_value_thb" type="number" min="0"></div>
      <div><label>Phone</label><input id="i_phone" placeholder="081 234 5678">
        <div class="hint">Saved as +66… for Meta matching</div></div>
      <div><label>Email</label><input id="i_email" type="email"></div>
      <div class="full"><label>Notes</label><textarea id="i_notes" rows="3"></textarea></div>
    </div>
    <div class="acts">
      <button class="del" id="bDel" style="display:none">Delete</button>
      <span class="sp"></span>
      <button class="btn-o" id="bCancel">Cancel</button>
      <button class="btn-p" id="bSave">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   CONFIG — set these two, then push to Vercel.
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/YOUR_ID/exec';                                  // Apps Script /exec URL
const TOKEN   = 'ac3a1aed740f96b293757bc289e37a355f2b5588d58a573b'; // must match Code.gs
/* ============================================================ */

const STATUSES = ['NEW','CONTACTED','QUALIFIED','TRIAL BOOKED','ATTENDED','ENROLLED','LOST'];
const COLORS = {
  'NEW':'#2B6CB0','CONTACTED':'#2f7fbf','QUALIFIED':'#3f8f8f',
  'TRIAL BOOKED':'#c98a1e','ATTENDED':'#5a9e3d','ENROLLED':'#3A8A4A','LOST':'#8a94a3'
};
// Days in a status before it's flagged as going stale.
const STALE_DAYS = { 'NEW':2,'CONTACTED':4,'QUALIFIED':5,'TRIAL BOOKED':7,'ATTENDED':3 };

const DEMO = [
  {id:'D1',name:'Parent A',child_age:'8',school:'School X',interest:'Design',source:'Meta',campaign:'',status:'NEW',phone:'',email:'',value_thb:'',notes:'',date_added:'2026-08-30',date_status_changed:'2026-08-30',date_enrolled:''},
  {id:'D2',name:'Parent B',child_age:'10',school:'School Y',interest:'3D',source:'Meta',campaign:'',status:'CONTACTED',phone:'',email:'',value_thb:'',notes:'',date_added:'2026-08-28',date_status_changed:'2026-08-29',date_enrolled:''},
  {id:'D3',name:'Parent C',child_age:'7',school:'School Z',interest:'Design',source:'Referral',campaign:'',status:'TRIAL BOOKED',phone:'',email:'',value_thb:'',notes:'',date_added:'2026-08-25',date_status_changed:'2026-08-27',date_enrolled:''},
  {id:'D4',name:'Parent D',child_age:'9',school:'School X',interest:'Tech',source:'Meta',campaign:'',status:'ENROLLED',phone:'',email:'',value_thb:'6900',notes:'',date_added:'2026-08-20',date_status_changed:'2026-08-26',date_enrolled:'2026-08-26'}
];

let leads = [];
let live = false;
let editing = null;
let sortKey = 'date_added', sortDir = -1;
const F = { status:'', q:'', source:'', interest:'', school:'' };

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
function daysSince(d){ if(!d) return null; const t=Date.parse(d+'T00:00:00'); if(isNaN(t)) return null; return Math.floor((Date.now()-t)/86400000); }

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2200); }

function normPhone(p){
  if(!p) return '';
  let s = String(p).replace(/[^0-9+]/g,'');
  if(s.startsWith('+')) return s;
  if(s.startsWith('66') && s.length>=11) return '+'+s;
  if(s.startsWith('0')) return '+66'+s.slice(1);
  return s ? '+66'+s : '';
}

/* ---------- data layer ---------- */
async function api(payload){
  const r = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight
    body: JSON.stringify(Object.assign({token:TOKEN}, payload))
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'request failed');
  return j;
}

async function load(){
  if(!API_URL){
    live = false; leads = DEMO.slice(); $('setup').style.display='block'; render(); return;
  }
  try{
    const r = await fetch(API_URL + '?token=' + encodeURIComponent(TOKEN));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    leads = j.leads; live = true; $('setup').style.display='none'; render();
  }catch(e){
    live = false; leads = DEMO.slice(); $('setup').style.display='block';
    toast('Could not reach the Sheet — showing demo data'); render();
  }
}

/* ---------- render ---------- */
function counts(){
  const c = {}; STATUSES.forEach(s=>c[s]=0);
  leads.forEach(l=>{ if(c[l.status]!==undefined) c[l.status]++; });
  return c;
}

function renderFunnel(){
  const c = counts();
  const reached = s => { const i = STATUSES.indexOf(s); let n=0;
    leads.forEach(l=>{ const j=STATUSES.indexOf(l.status);
      if(l.status==='LOST') return; if(j>=i) n++; }); return n; };
  const top = reached('NEW') || 0;
  $('funnel').innerHTML = STATUSES.map(s=>{
    const conv = (s==='LOST'||!top) ? '' : Math.round(reached(s)/top*100)+'% of all';
    return `<div class="fstep ${F.status===s?'on':''}" data-s="${s}">
      <div class="n" style="color:${COLORS[s]}">${c[s]}</div>
      <div class="l">${s}</div><div class="c">${conv}</div></div>`;
  }).join('');
  document.querySelectorAll('.fstep').forEach(el=>{
    el.onclick = () => { F.status = (F.status===el.dataset.s) ? '' : el.dataset.s; render(); };
  });
}

function fillFilter(id, key){
  const sel = $(id), cur = sel.value;
  const vals = [...new Set(leads.map(l=>l[key]).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">All ${key==='school'?'schools':key+'s'}</option>` +
    vals.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('');
}

function visible(){
  const q = F.q.toLowerCase();
  return leads.filter(l=>{
    if(F.status && l.status!==F.status) return false;
    if(F.source && l.source!==F.source) return false;
    if(F.interest && l.interest!==F.interest) return false;
    if(F.school && l.school!==F.school) return false;
    if(q){
      const hay = [l.name,l.school,l.interest,l.source,l.campaign,l.phone,l.email,l.notes].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>{
    let x=a[sortKey]||'', y=b[sortKey]||'';
    if(sortKey==='child_age'||sortKey==='value_thb'){ x=+x||0; y=+y||0; }
    return x<y ? -sortDir : x>y ? sortDir : 0;
  });
}

const COLS = [
  ['name','Parent / child'],['school','School'],['interest','Interest'],
  ['source','Source'],['campaign','Campaign'],['status','Status'],
  ['date_status_changed','Days in stage'],['value_thb','Value'],['date_added','Added']
];

function render(){
  renderFunnel();
  fillFilter('fSource','source'); fillFilter('fInterest','interest'); fillFilter('fSchool','school');
  const dl = $('dl_school');
  dl.innerHTML = [...new Set(leads.map(l=>l.school).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('');

  const rows = visible();
  $('count').textContent = `${rows.length} of ${leads.length} leads` + (live?'':' · demo mode');

  if(!rows.length){
    $('tableHost').innerHTML = `<div class="empty">No leads match. ${leads.length?'Try clearing filters.':'Add your first lead.'}</div>`;
    return;
  }

  $('tableHost').innerHTML = `<table><thead><tr>${
    COLS.map(([k,l])=>`<th data-k="${k}" class="${k==='campaign'||k==='date_added'?'hide-s':''}">${l}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')
  }</tr></thead><tbody>${rows.map(l=>{
    const d = daysSince(l.date_status_changed);
    const lim = STALE_DAYS[l.status];
    const stale = (lim!=null && d!=null && d>lim);
    return `<tr data-id="${esc(l.id)}">
      <td><span class="nm">${esc(l.name)||'—'}</span><div class="sub">${l.child_age?'age '+esc(l.child_age):''}${l.phone?' · '+esc(l.phone):''}</div></td>
      <td>${esc(l.school)}</td>
      <td>${esc(l.interest)}</td>
      <td>${esc(l.source)}</td>
      <td class="hide-s">${esc(l.campaign)}</td>
      <td><select class="st" style="color:${COLORS[l.status]||'#000'}">${
        STATUSES.map(s=>`<option${s===l.status?' selected':''}>${s}</option>`).join('')}</select></td>
      <td class="${stale?'stale':'sub'}">${d==null?'—':d+'d'}${stale?' ⚠':''}</td>
      <td>${l.value_thb?'฿'+Number(l.value_thb).toLocaleString():''}</td>
      <td class="sub hide-s">${esc(l.date_added)}</td>
    </tr>`;
  }).join('')}</tbody></table>`;

  document.querySelectorAll('th[data-k]').forEach(th=>{
    th.onclick = () => { const k=th.dataset.k;
      if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=1;} render(); };
  });
  document.querySelectorAll('tbody tr').forEach(tr=>{
    const id = tr.dataset.id;
    tr.querySelector('.nm').onclick = () => openModal(leads.find(l=>l.id===id));
    tr.querySelector('.st').onchange = e => setStatus(id, e.target.value);
  });
}

/* ---------- mutations ---------- */
async function setStatus(id, status){
  const l = leads.find(x=>x.id===id); if(!l) return;
  const prev = l.status;
  l.status = status;
  l.date_status_changed = today();
  if(status==='ENROLLED' && !l.date_enrolled) l.date_enrolled = today();
  render();
  if(!live) return;
  try{ await api({action:'update', id, patch:{status}}); toast(`${l.name} → ${status}`); }
  catch(e){ l.status = prev; render(); toast('Save failed: '+e.message); }
}

function openModal(lead){
  editing = lead || null;
  $('mTitle').textContent = lead ? 'Edit lead' : 'New lead';
  $('i_status').innerHTML = STATUSES.map(s=>`<option>${s}</option>`).join('');
  ['name','child_age','school','interest','source','campaign','status','value_thb','phone','email','notes']
    .forEach(k => $('i_'+k).value = lead ? (lead[k]||'') : (k==='status'?'NEW':''));
  $('bDel').style.display = lead ? 'block' : 'none';
  $('ov').classList.add('on');
  $('i_name').focus();
}
function closeModal(){ $('ov').classList.remove('on'); editing=null; }

async function save(){
  const d = {};
  ['name','child_age','school','interest','source','campaign','status','value_thb','phone','email','notes']
    .forEach(k => d[k] = $('i_'+k).value.trim());
  if(!d.name){ toast('Parent name is required'); return; }
  d.phone = normPhone(d.phone);
  d.email = d.email.toLowerCase();

  if(editing){
    Object.assign(editing, d);
    if(d.status==='ENROLLED' && !editing.date_enrolled) editing.date_enrolled = today();
    render(); closeModal();
    if(live){ try{ await api({action:'update', id:editing.id, patch:d}); toast('Saved'); }
              catch(e){ toast('Save failed: '+e.message); } }
  } else {
    if(live){
      try{ const j = await api({action:'create', lead:d}); leads.push(j.lead); render(); closeModal(); toast('Lead added'); }
      catch(e){ toast('Save failed: '+e.message); }
    } else {
      d.id='T'+Date.now(); d.date_added=today(); d.date_status_changed=today();
      d.date_enrolled = d.status==='ENROLLED'?today():'';
      leads.push(d); render(); closeModal(); toast('Added (demo — not saved)');
    }
  }
}

async function del(){
  if(!editing) return;
  if(!confirm('Delete '+editing.name+'? This removes the row from the Sheet.')) return;
  const id = editing.id;
  leads = leads.filter(l=>l.id!==id);
  render(); closeModal();
  if(live){ try{ await api({action:'delete', id}); toast('Deleted'); } catch(e){ toast('Delete failed'); } }
}

/* ---------- exports ---------- */
function download(name, text){
  const b = new Blob(['﻿'+text], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const cell = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;

function exportAll(){
  const cols = ['id','name','child_age','school','interest','source','campaign','status','phone','email','value_thb','notes','date_added','date_status_changed','date_enrolled'];
  const rows = visible();
  download(`arc-leads-${today()}.csv`,
    [cols.join(',')].concat(rows.map(l=>cols.map(c=>cell(l[c])).join(','))).join('\n'));
  toast(`Exported ${rows.length} leads`);
}

// Meta Customer List format: phone/email only, one row per enrolled parent.
function exportMeta(){
  const enrolled = leads.filter(l=>l.status==='ENROLLED' && (l.phone || l.email));
  if(!enrolled.length){
    alert('No enrolled leads have a phone or email yet.\n\nMeta matches customers on hashed phone/email — without at least one, the customer list cannot be built.');
    return;
  }
  const skipped = leads.filter(l=>l.status==='ENROLLED').length - enrolled.length;
  download(`meta-customer-list-${today()}.csv`,
    ['phone,email,country,value,currency'].concat(
      enrolled.map(l=>[cell(l.phone),cell(l.email),cell('TH'),cell(l.value_thb||''),cell('THB')].join(','))
    ).join('\n'));
  toast(`${enrolled.length} customers exported${skipped?` · ${skipped} skipped (no contact)`:''}`);
}

/* ---------- wiring ---------- */
$('bNew').onclick   = () => openModal(null);
$('bSave').onclick  = save;
$('bDel').onclick   = del;
$('bCancel').onclick= closeModal;
$('bCsv').onclick   = exportAll;
$('bMeta').onclick  = exportMeta;
$('bReload').onclick= load;
$('ov').onclick     = e => { if(e.target===$('ov')) closeModal(); };
document.onkeydown  = e => { if(e.key==='Escape') closeModal(); };
$('q').oninput      = e => { F.q=e.target.value; render(); };
$('fSource').onchange   = e => { F.source=e.target.value; render(); };
$('fInterest').onchange = e => { F.interest=e.target.value; render(); };
$('fSchool').onchange   = e => { F.school=e.target.value; render(); };
$('bClear').onclick = () => { F.status=F.q=F.source=F.interest=F.school='';
  $('q').value=''; ['fSource','fInterest','fSchool'].forEach(i=>$(i).value=''); render(); };

load();
</script>
</body>
</html>
